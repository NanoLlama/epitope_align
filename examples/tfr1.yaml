# Transferrin receptor 1: mouse and rat bind, human and marmoset do not.
#
#   epitope-map --config examples/tfr1.yaml --outdir results/tfr1-run-1
#
# Needs network access (UniProt and AlphaFold DB).
#
# Almost everything comes from the built-in target profile: sequences,
# topology, the four structural domains, and nine candidate orthologs. Run
# `epitope-map --list-targets` to see it, or read
# epitope_map/data/targets/tfr1.yaml. Anything set here wins over the profile,
# and the report's parameter table says which values came from where.
target: tfr1

binding: examples/tfr1_binding.csv

# The profile lists 1CX8 (ectodomain) and 1SUV (with transferrin) but does not
# choose for you: check assembly and resolution first. An experimental structure
# gives a real biological assembly for SASA, which matters here because TfR1 is
# a disulfide-linked homodimer whose helical domain forms the interface - on an
# AlphaFold monomer that interface is scored as exposed.
structure: AF-Q62351-F1
chain: A

# The apical surface came back split across several patches at 12 A. The sweep
# says which of them are one surface; 30 A is what a paratope covers.
patch_radius: 12
radius_sweep: 10,12,14,16,18
footprint_diameter: 30

rsa_cutoff: 0.20
min_patch_size: 2
top_n: 5

# With an experimental dimer, name the partner chain so the interface is masked
# rather than counted as exposed:
# context_chains: B

# With a human TfR1 structure to hand, derive residue equivalences from 3D
# rather than from the aligner's guess in the 195-235 loop:
# equivalence: structural
# species_structure: human=AF-P02786-F1

# Map this run's patches onto a previous run's IDs:
# compare_run: results/tfr1-run-1
